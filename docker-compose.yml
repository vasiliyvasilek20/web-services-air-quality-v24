name: air-quality-v24
services:
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_HOST: db
      DB_NAME: air_quality
      DB_USER: air_app
      DB_PASSWORD: ${DB_PASSWORD:-local_lab_password}
      AQI_SERVICE_URL: http://web-service:8001
    depends_on:
      db:
        condition: service_healthy
      web-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: air_quality
      POSTGRES_USER: air_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_lab_password}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U air_app -d air_quality"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  web-service:
    build:
      context: .
      dockerfile: web-service/Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
    restart: unless-stopped
volumes:
  db_data:
